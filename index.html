<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7ec4c4" />
    <meta name="description" content="Daily Pug — A minimal, cute, and joyful daily mood tracker." />
    <title>Daily Pug — Mood Tracker</title>
    <link rel="icon" type="image/svg+xml" href="pugs/very-happy.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Scenic Background (Sky with clouds at top, walking pug in bottom whitespace) -->
    <div class="scenic-background" aria-hidden="true">
      <!-- Sky & Floating Clouds -->
      <div class="sky-scene">
        <div class="cloud cloud-1">
          <svg viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M25 45 C15 45 8 38 8 28 C8 19 16 12 26 12 C28 6 35 2 44 2 C55 2 64 8 68 18 C72 15 78 14 84 14 C96 14 106 23 106 34 C112 35 116 40 116 45 C116 52 110 57 103 57 L25 57 C19 57 15 52 15 47" fill="#ffffff" fill-opacity="0.85" />
          </svg>
        </div>
        <div class="cloud cloud-2">
          <svg viewBox="0 0 140 70" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M30 52 C18 52 10 44 10 32 C10 22 19 14 31 14 C33 7 42 2 52 2 C65 2 76 9 81 21 C86 17 93 16 100 16 C114 16 126 27 126 40 C133 41 138 47 138 53 C138 61 131 67 122 67 L30 67 C23 67 18 61 18 55" fill="#ffffff" fill-opacity="0.75" />
          </svg>
        </div>
        <div class="cloud cloud-3">
          <svg viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 38 C12 38 6 32 6 24 C6 16 13 10 21 10 C23 5 29 1 37 1 C46 1 54 6 57 15 C61 12 66 11 71 11 C81 11 89 19 89 28 C94 29 98 33 98 38 C98 44 93 48 87 48 L20 48" fill="#ffffff" fill-opacity="0.7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- App Container -->
    <div class="app-container">
      <!-- Main Content -->
      <main>
        <!-- Top Bar -->
        <header class="top-bar">
          <div class="brand">
            <div class="brand-icon" id="brandIcon"></div>
            <h1 class="brand-title">Daily <span>Pug</span></h1>
          </div>

          <button class="icon-button" id="settingsBtn" aria-label="Settings and Data Management">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </header>

        <!-- Month Navigation Header -->
        <div class="calendar-header">
          <button class="nav-arrow-btn" id="prevMonthBtn" aria-label="Previous Month">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </button>

          <button class="month-picker-trigger" id="monthPickerBtn" aria-label="Open Month Picker">
            <span class="month-title" id="monthTitle">Sep 2026</span>
            <span class="chevron-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>

          <button class="nav-arrow-btn" id="nextMonthBtn" aria-label="Next Month">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </button>
        </div>

        <!-- Calendar Card Container -->
        <div class="calendar-card" id="calendarCard">
          <!-- Weekday Headers (All 7 uniform styling) -->
          <div class="weekdays-row">
            <div class="weekday-label">Sun</div>
            <div class="weekday-label">Mon</div>
            <div class="weekday-label">Tue</div>
            <div class="weekday-label">Wed</div>
            <div class="weekday-label">Thu</div>
            <div class="weekday-label">Fri</div>
            <div class="weekday-label">Sat</div>
          </div>

          <!-- 7-Column Day Cells Grid -->
          <div class="days-grid" id="daysGrid"></div>
        </div>
      </main>

      <!-- Centered Bottom Quick-Action Button for Today -->
      <div class="bottom-action-container">
        <button class="quick-action-btn" id="quickActionBtn" aria-label="Log today's mood">
          <div class="quick-btn-icon" id="quickBtnIcon"></div>
          <div class="quick-btn-text">
            <span class="quick-btn-subtitle" id="quickBtnSubtitle">Log Today</span>
            <span class="quick-btn-title" id="quickBtnTitle">How's today?</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Mood Picker Popup Modal -->
    <div class="modal-backdrop" id="moodPopupBackdrop" role="dialog" aria-modal="true">
      <div class="popup-card">
        <div class="popup-header">
          <div>
            <h2 class="popup-header-title" id="moodPopupTitle">Saturday, Sep 12</h2>
          </div>
          <button class="close-btn" id="closeMoodPopupBtn" aria-label="Close popup">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- 5 Pug Options in a Row -->
        <div class="mood-options-row" id="moodOptionsContainer"></div>
      </div>
    </div>

    <!-- Month Picker Modal -->
    <div class="modal-backdrop month-picker-modal" id="monthPickerBackdrop" role="dialog" aria-modal="true">
      <div class="popup-card">
        <div class="popup-header">
          <div class="year-nav-row" style="width: 100%; margin-bottom: 0;">
            <button class="nav-arrow-btn" id="prevYearBtn" aria-label="Previous Year">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <span class="year-title" id="pickerYearTitle">2026</span>
            <button class="nav-arrow-btn" id="nextYearBtn" aria-label="Next Year">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>
          <button class="close-btn" id="closeMonthPickerBtn" aria-label="Close month picker" style="margin-left: 8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="months-grid" id="monthsGrid"></div>

        <button class="jump-today-btn" id="jumpTodayBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span>Jump to Current Month</span>
        </button>
      </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop" id="settingsBackdrop" role="dialog" aria-modal="true">
      <div class="popup-card">
        <div class="popup-header">
          <h2 class="popup-header-title">Settings & Data</h2>
          <button class="close-btn" id="closeSettingsBtn" aria-label="Close settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <div class="stats-box">
          <span class="stats-label">Total Logged Days:</span>
          <span class="stats-badge" id="totalDaysCount">0</span>
        </div>

        <button class="settings-btn export-btn" id="exportBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>Export Mood Data (JSON)</span>
        </button>

        <button class="settings-btn clear-btn" id="clearAllBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span>Clear All Mood Entries</span>
        </button>

        <div class="confirm-clear-box" id="confirmClearBox" style="display: none;">
          <span class="confirm-text">⚠️ Are you sure? This cannot be undone.</span>
          <div class="confirm-actions">
            <button class="confirm-yes-btn" id="confirmYesBtn">Yes, Clear All</button>
            <button class="confirm-no-btn" id="confirmNoBtn">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <!-- Vanilla Script: Runs directly from filesystem via file:// without CORS errors -->
    <script src="app.js"></script>
  </body>
</html>
